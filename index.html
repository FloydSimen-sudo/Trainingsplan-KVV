<html lang="de">
<head>
<meta charset="utf-8">

<title>Trainingspläne KVV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{

  .mono{font-family:'Roboto Mono',monospace}

  .header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 18px 12px;position:sticky;top:0;background:var(--bg2);z-index:5;border-bottom:1px solid var(--border)}

  .pickerGroupLabel{font:500 9px/1 'Roboto Mono',monospace;letter-spacing:.08em;color:var(--di);text-transform:uppercase;margin-bottom:8px}

  .footNote{font:400 10.5px/1.5 'Roboto Mono',monospace;color:var(--di);text-wrap:pretty;padding-bottom:8px}
  .intro{padding:16px 18px 4px;display:flex;flex-direction:column;gap:6px}

<body>
<div id="app"></div>
<script>
const AM='#00588f', LI='#128089', TX='#0f2436', MU='#6b8496', DI='#9db0bd';
const GNAME={'U9':'U9','U11I':'U11 I','U11II':'U11 II','U13 I':'U13 I','U13II':'U13 II','U15I':'U15 I','U15 II':'U15 II','SPOGY Gruppe':'SPOGY'};
const GCLASS={'U9':'U9','U11I':'U11','U11II':'U11','U13 I':'U13','U13II':'U13','U15I':'U15','U15 II':'U15','SPOGY Gruppe':'U17'};
const WKCLASS_TO_AGE = (wk)=>{ if(!wk) return 'U19'; const m = String(wk).match(/U(9|11|13|15|17|19)/); return m ? 'U'+m[1] : 'U19'; };
const MNAMES=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const PHASECOL = {
  'Max': {bg:'rgba(0,88,143,.14)', bd:'rgba(0,88,143,.4)', fg:AM, bar:AM},
  'SK': {bg:'rgba(18,128,137,.14)', bd:'rgba(18,128,137,.4)', fg:LI, bar:LI},
  'Skill': {bg:'rgba(18,128,137,.14)', bd:'rgba(18,128,137,.4)', fg:LI, bar:LI},
  'Max/SK': {bg:'rgba(91,95,166,.14)', bd:'rgba(91,95,166,.4)', fg:'#5b5fa6', bar:'#5b5fa6'},
  'KA': {bg:'rgba(111,164,201,.2)', bd:'rgba(111,164,201,.5)', fg:'#3f7ea8', bar:'#6fa4c9'},
  'Aufbau': {bg:'#e0e8f0', bd:'rgba(10,50,80,.16)', fg:'#33546a', bar:'#c3ccd6'},
  'Basis': {bg:'#e0e8f0', bd:'rgba(10,50,80,.16)', fg:'#33546a', bar:'#aebccb'},
  'Fels': {bg:'transparent', bd:'rgba(18,128,137,.4)', fg:'#0f6f77', bar:'rgba(18,128,137,.35)'},
  'Fels + Basis': {bg:'transparent', bd:'rgba(18,128,137,.4)', fg:'#0f6f77', bar:'rgba(18,128,137,.35)'},
  'Pause': {bg:'transparent', bd:'rgba(10,50,80,.16)', fg:'#9db0bd', bar:'#e3e8ef'},
  'WK': {bg:'rgba(241,119,78,.16)', bd:'rgba(241,119,78,.5)', fg:'#c85a30', bar:'#f1774e'},
};
const PHASE_NEUTRAL = {bg:'transparent', bd:'rgba(10,50,80,.1)', fg:'#9db0bd', bar:'#eef3f7'};

function val(x){ return (x===null||x===undefined||x==='') ? '-' : x; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---- ISO Woche ----
function isoWeekMonday(year, week){
  const simple = new Date(Date.UTC(year,0,1+(week-1)*7));
  const dow = simple.getUTCDay() || 7;
  const monday = new Date(simple);
  if(dow<=4) monday.setUTCDate(simple.getUTCDate()-dow+1); else monday.setUTCDate(simple.getUTCDate()+8-dow);
  return monday;
}
function getISOWeek(date){
  const d = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
  const dayNum = (d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-dayNum+3);
  const firstThu = new Date(Date.UTC(d.getUTCFullYear(),0,4));
  const week = 1+Math.round(((d-firstThu)/86400000-3+((firstThu.getUTCDay()+6)%7))/7);
  return {year: d.getUTCFullYear(), kw: week};
}
function addWeeks(year, kw, delta){
  const d = isoWeekMonday(year, kw);
  d.setUTCDate(d.getUTCDate()+delta*7);
  return getISOWeek(d);
}
const NOW = getISOWeek(new Date());

// ---- State ----
const D = (window.TPDATA || {GROUPS:[],COACHES:[],EX:{},PLANS:{},CATS_BY_VIEW:{},WEEKS_BY_ATHLETE:{},BENCH:{},GK:{},SOURCE_INFO:{}});
const spogy = D.GROUPS.find(g=>g.id==='SPOGY Gruppe');

const state = {
  view: {t:'a', id:'Adrian Kathan'},
  tab: 'Woche',
  year: NOW.year, kw: NOW.kw, day: 0,
  weekView: 'tage',
  picker: false, openSlot: null,
};

function setState(patch){ Object.assign(state, patch); render(); }

// ---- Render ----
function render(){
  const el = document.getElementById('app');
  el.innerHTML = renderApp();
  wireEvents();
  window.scrollTo(0,0);
}

function renderApp(){
  const view = state.view;
  const isSolo = view.t === 'a';
  const group = !isSolo ? D.GROUPS.find(g=>g.id===view.id) : null;
  const athlete = isSolo && spogy ? spogy.athletes.find(a=>a.n===view.id) : null;
  const viewName = isSolo ? view.id : (GNAME[view.id] || view.id);
  const viewSub = isSolo ? ('EINZELPLAN · WK-KLASSE ' + val(athlete ? athlete.wk : null)) : ('GRUPPENPLAN · ' + (group ? group.athletes.length : 0) + ' ATHLET:INNEN');
  const key = (isSolo?'a:':'g:') + view.id;
  const srcInfo = D.SOURCE_INFO[key] || '-';
  const hasSource = !!(D.PLANS[key] && Object.keys(D.PLANS[key]).length);

  const tabNames = ['Woche','Jahr'];
  if(isSolo){ tabNames.push('Statistik'); tabNames.push('Benchmarks'); }
  tabNames.push('Kader');
  if(tabNames.indexOf(state.tab) < 0) state.tab = 'Woche';

  return `
    <div class="header">
      <span class="brandMark"></span>
      <button class="headerBtn" data-act="openPicker" style="flex:1">
        <span style="display:flex;flex-direction:column;gap:3px;min-width:0">
          <span class="viewName">${esc(viewName)}</span>
          <span class="viewSub">${esc(viewSub)}</span>
        </span>
        <span class="caret">▾</span>
      </button>
    </div>
    <div class="syncbar">
      <span class="dot"></span>
      <div style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0">
        <span class="syncFile">${esc(srcInfo)}</span>
        <span class="syncInfo">Stand ${esc(D.GENERATED || '-')} · Aktualisierung durch Floyd (Excel → Push)</span>
      </div>
    </div>
    <div class="content">
      ${state.tab==='Woche' ? renderWoche(view, isSolo, key, hasSource, srcInfo) : ''}
      ${state.tab==='Jahr' ? renderJahr(view, isSolo, athlete, group) : ''}
      ${state.tab==='Statistik' ? renderStatistik(view) : ''}
      ${state.tab==='Benchmarks' ? renderBenchmarks(view) : ''}
      ${state.tab==='Kader' ? renderKader() : ''}
    </div>
    <div class="tabs">
      ${tabNames.map(n=>`
        <button class="tab ${state.tab===n?'sel':''}" data-act="tab" data-tab="${n}">
          <span class="icon"></span><span class="lbl">${n.toUpperCase()}</span>
        </button>`).join('')}
    </div>
    ${state.picker ? renderPicker() : ''}
  `;
}

function renderWoche(view, isSolo, key, hasSource, srcInfo){
  if(!hasSource){
    return `<div class="empty">
      <div class="t1">Keine Daten hinterlegt</div>
      <div class="t2">${esc(srcInfo)}</div>
    </div>`;
  }
  const plans = D.PLANS[key] || {};
  const wkKey = state.year + '-' + state.kw;
  const plan = plans[wkKey] || null;
  const days = plan ? plan.days : [];
  const di = Math.min(state.day, Math.max(0, days.length-1));
  const day = days[di] || null;

  const dayChips = days.map((dd,i)=>`
    <button class="dayChip ${i===di?'sel':''}" data-act="day" data-i="${i}">
      <span class="dow">${esc((dd.dow||'').slice(0,2).toUpperCase())}</span>
      <span class="dom">${esc(dd.dom)}</span>
    </button>`).join('');

  const dayMeta = [];
  if(day && day.ort) dayMeta.push({k:'Ort', v:day.ort});

  const renderItem = (it) => {
    const m = it.match;
    const chips = [];
    if(m){
      if(m.min!=null && m.min!=='') chips.push(`<span class="metaTag hi">${esc(m.min)} min</span>`);
      if(m.sets!=null && m.sets!=='' && m.sets!=='x') chips.push(`<span class="metaTag">${esc(m.sets)}</span>`);
      if(m.vol!=null && m.vol!=='' && m.vol!=='x') chips.push(`<span class="metaTag">${esc(m.vol)}</span>`);
      if(m.pause!=null && m.pause!=='' && m.pause!=='x') chips.push(`<span class="metaTag">Pause ${esc(m.pause)}</span>`);
    }
    return `<div class="slotName">${esc(it.ex)}</div>${chips.length ? `<div class="slotMeta">${chips.join('')}</div>` : ''}`;
  };

  const sessionsHtml = (day && day.sessions ? day.sessions : []).map(s=>`
    <div class="card">
      <div class="cardHead">
        <span class="name"><span class="dotSm"></span>${esc(s.name)}</span>
        ${s.time ? `<span class="time">${esc(s.time)}</span>` : ''}
      </div>
      <div>
        ${ (s.cats || []).map(cat=>`
          <div class="slotRow">
            <div class="slotK">${esc(cat.name)}</div>
            <div>
              ${ cat.items && cat.items.length
                  ? cat.items.map(renderItem).join('<div style="height:8px"></div>')
                  : `<div class="slotName" style="color:${DI}">-</div>` }
            </div>
          </div>`).join('') }
      </div>
    </div>
    <div class="noteBlock">
      <span class="l">Notizen</span>
      <span class="t">${s.notiz ? esc(s.notiz) : '-'}</span>
    </div>`).join('');

  const dk = day && day.doku ? day.doku : null;
  const scale = (label, v)=>{
    const n = (typeof v === 'number') ? Math.round(v) : 0;
    return `<div style="display:flex;flex-direction:column;gap:7px">
      <div class="scaleLabel"><span class="l">${label}</span><span class="v">${val(v)} / 10</span></div>
      <div class="cells">${Array.from({length:10},(_,i)=>`<div class="cell ${i<n?'on':''}"></div>`).join('')}</div>
    </div>`;
  };
  const dl = dk ? (parseFloat(dk.d1)||0) + (parseFloat(dk.d2)||0) : 0;
  const dayLoad = (dk && typeof dk.ee === 'number') ? Math.round(dl*dk.ee*10)/10 : null;

  return `
    <div class="weekNav">
      <button class="navBtn" data-act="prevWeek">‹</button>
      <div class="weekTitle">
        <div class="weekKw">KW ${state.kw} · ${state.year}</div>
        <div class="weekMeta">${plan ? esc(plan.span) : 'NOCH NICHT GEPLANT'}</div>
      </div>
      <button class="navBtn" data-act="nextWeek">›</button>
    </div>
    ${!plan ? `<div class="empty">
        <div class="t1">Kein Plan für diese Woche</div>
        <div class="t2">Sobald die Woche in der Einheitenplanung steht, erscheint sie hier beim nächsten Update.</div>
        <div class="footNote">${esc(srcInfo)}</div>
      </div>` : `
      <div class="weekview">
        <button class="weekviewBtn ${state.weekView!=='kurz'?'sel':''}" data-act="weekview" data-wv="tage">Tage</button>
        <button class="weekviewBtn ${state.weekView==='kurz'?'sel':''}" data-act="weekview" data-wv="kurz">Woche kompakt</button>
      </div>
      ${state.weekView==='kurz' ? `
        <div class="kurzTable">${renderKurz(days, di)}</div>
      ` : `
      <div class="dayChips">${dayChips}</div>
      <div class="dayHead"><div class="dayTitle">${esc(day ? (day.dow+', '+day.dom) : '')}</div></div>
      ${dayMeta.length ? `<div class="metaRow">${dayMeta.map(m=>`<div class="metaPill"><span class="k">${esc(m.k)}</span><span class="v">${esc(m.v)}</span></div>`).join('')}</div>` : ''}
      ${ (day && day.sessions && day.sessions.length) ? sessionsHtml : `<div class="dashed">Trainingsfrei / keine Einheit eingetragen</div>` }
      ${dk ? `
        <div class="dokuBlock">
          <div style="display:flex;align-items:baseline;justify-content:space-between">
            <div style="display:flex;align-items:baseline;gap:7px">
              <span style="font:600 12px/1 Archivo,sans-serif">Doku</span>
              <span style="font:400 9px/1 'Roboto Mono',monospace;color:${DI}">aus Excel</span>
            </div>
          </div>
          ${scale('Motivation', dk.mot)}
          ${scale('Erschöpfung Beginn', dk.eb)}
          ${scale('Erschöpfung Ende', dk.ee)}
          <div class="durRow">
            <div class="durBox"><span class="k">Dauer S1</span><span class="v">${val(dk.d1)}${dk.d1!=null?' h':''}</span></div>
            <div class="durBox"><span class="k">Dauer S2</span><span class="v">${val(dk.d2)}${dk.d2!=null?' h':''}</span></div>
          </div>
          <div class="loadRow"><span class="k">Load</span><span class="v">${val(dayLoad)}</span></div>
        </div>` : ''}
      `}
    `}
  `;
}

function renderKurz(days, di){
  return (days||[]).map((dd,i)=>{
    const hasSessions = dd.sessions && dd.sessions.length;
    let body = `<span class="kurzNone">-</span>`;
    if(hasSessions){
      const catNames = [];
      dd.sessions.forEach(s=>{
        (s.cats||[]).forEach(cat=>{
          if(cat.items && cat.items.length && catNames.indexOf(cat.name)<0) catNames.push(cat.name);
        });
      });
      body = catNames.length
        ? `<div class="kurzCats">${catNames.map(n=>`<span class="kurzCat">${esc(n)}</span>`).join('')}</div>`
        : `<span class="kurzNone">-</span>`;
    }
    return `<button class="kurzRow ${i===di?'today':''}" data-act="day" data-i="${i}">
      <div class="kurzDay"><span class="dow">${esc((dd.dow||'').slice(0,2).toUpperCase())}</span><span class="dom">${esc(dd.dom)}</span></div>
      <div class="kurzBody">
        ${dd.ort ? `<span class="kurzOrt">${esc(dd.ort)}</span>` : ''}
        ${body}
      </div>
    </button>`;
  }).join('');
}

function renderJahr(view, isSolo, athlete, group){
  const jp = isSolo ? D.JAHRESPLAN[view.id] : null;
  if(jp && jp.length) return renderJahrPhasen(view, jp);
  return renderJahrEvents(view, isSolo, athlete, group);
}

function renderJahrPhasen(view, weeks){
  const src = D.JAHRESPLAN_SOURCE[view.id] || '-';
  const withMeta = weeks.map(w=>{
    const mon = isoWeekMonday(w.year, w.kw);
    const monEnd = new Date(mon); monEnd.setUTCDate(monEnd.getUTCDate()+6);
    const pad = n => String(n).padStart(2,'0');
    const span = pad(mon.getUTCDate())+'.'+pad(mon.getUTCMonth()+1)+'. – '+pad(monEnd.getUTCDate())+'.'+pad(monEnd.getUTCMonth()+1)+'.';
    const monLabel = MNAMES[mon.getUTCMonth()] + ' ' + String(w.year).slice(2);
    const cur = w.year===NOW.year && w.kw===NOW.kw;
    return Object.assign({}, w, {span, monLabel, cur});
  });

  const ribbon = withMeta.map(w=>{
    const p = w.phase ? (PHASECOL[w.phase] || PHASE_NEUTRAL) : PHASE_NEUTRAL;
    return `<div class="ribbonBar ${w.cur?'cur':''}" style="background:${p.bar}" title="KW ${w.kw} · ${esc(w.phase||w.phaseRaw||'-')}"></div>`;
  }).join('');

  const usedPhases = [];
  withMeta.forEach(w=>{ if(w.phase && usedPhases.indexOf(w.phase)<0) usedPhases.push(w.phase); });
  const legend = usedPhases.map(p=>`<div class="legendItem"><span class="legendSwatch" style="background:${(PHASECOL[p]||PHASE_NEUTRAL).bar}"></span>${esc(p)}</div>`).join('')
    + `<div class="legendItem"><span class="legendSwatch" style="background:${AM}"></span>Boulder-WK</div>`
    + `<div class="legendItem"><span class="legendSwatch" style="background:${LI}"></span>Lead-WK</div>`;

  const buckets = [];
  withMeta.forEach(w=>{
    let b = buckets[buckets.length-1];
    if(!b || b.label!==w.monLabel){ b = {label:w.monLabel, weeks:[]}; buckets.push(b); }
    b.weeks.push(w);
  });

  const weekRow = (w)=>{
    const p = w.phase ? (PHASECOL[w.phase] || PHASE_NEUTRAL) : null;
    const items = [];
    if(w.boulder) items.push(`<div class="evItem"><span class="evChip" style="background:rgba(0,88,143,.14);color:${AM}">Boulder</span><span class="evText">${esc(w.boulder)}</span></div>`);
    if(w.lead) items.push(`<div class="evItem"><span class="evChip" style="background:rgba(18,128,137,.14);color:${LI}">Lead</span><span class="evText">${esc(w.lead)}</span></div>`);
    if(w.fels) items.push(`<div class="evItem"><span class="evChip">Fels</span><span class="evText">${esc(w.fels)}</span></div>`);
    if(w.ferien) items.push(`<div class="evItem"><span class="evChip">Ferien</span><span class="evText">${esc(w.ferien)}</span></div>`);
    if(w.sonstiges) items.push(`<div class="evItem"><span class="evChip">Sonstiges</span><span class="evText">${esc(w.sonstiges)}</span></div>`);
    (w.notes||[]).forEach(n=>items.push(`<div class="evItem"><span class="evChip">${esc(n.label)}</span><span class="evText">${esc(n.text)}</span></div>`));
    if(!w.phase && w.phaseRaw) items.unshift(`<div class="evItem"><span class="evText" style="color:${MU}">${esc(w.phaseRaw)}</span></div>`);
    return `
      <div class="evRow">
        <div class="evKw"><span class="k">KW ${w.kw}</span><span class="d">${esc(w.span)}</span></div>
        <div class="evItems">
          <div class="jahrRowHead">
            ${p ? `<span class="phaseChip" style="background:${p.bg};border:1px solid ${p.bd};color:${p.fg}">${esc(w.phase)}</span>` : ''}
            ${w.reduziert ? `<span class="reduTag">Reduziert</span>` : ''}
            ${w.cur ? `<span class="reduTag" style="color:${AM};border-color:rgba(0,88,143,.4)">Aktuell</span>` : ''}
          </div>
          ${items.join('')}
        </div>
      </div>`;
  };

  return `
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span class="sectionTitle">Jahresplan</span>
        <span class="subMeta">${withMeta.length} WOCHEN</span>
      </div>
      <div class="footNote">${esc(src)}. Phasen und WK-Termine direkt aus der Jahresplanung — Wochen ohne Eintrag bleiben neutral, keine erfundenen Werte.</div>
    </div>
    <div class="ribbonWrap">${ribbon}</div>
    <div class="legendRow">${legend}</div>
    ${buckets.map(b=>`
      <div>
        <div class="monthHead"><span class="m">${esc(b.label)}</span></div>
        ${b.weeks.map(weekRow).join('')}
      </div>`).join('')}
  `;
}

function renderJahrEvents(view, isSolo, athlete, group){
  const ageClass = isSolo ? WKCLASS_TO_AGE(athlete ? athlete.wk : null) : (GCLASS[view.id] || 'U15');
  const gkc = D.GK[ageClass] || {};
  const keys = Object.keys(gkc).sort((a,b)=>{ const A=a.split('-').map(Number), B=b.split('-').map(Number); return (A[0]-B[0])||(A[1]-B[1]); });
  if(!keys.length){
    return `<div class="empty">
      <div class="t1">Keine Termine für Klasse ${esc(ageClass)}</div>
      <div class="t2">Sobald im Gesamtkalender Termine für diese Wettkampfklasse eingetragen sind, erscheinen sie hier.</div>
    </div>`;
  }
  const buckets = [];
  keys.forEach(k=>{
    const w = gkc[k];
    const [y,kwn] = k.split('-').map(Number);
    const mon = isoWeekMonday(y,kwn).getUTCMonth();
    const label = MNAMES[mon] + ' ' + String(y).slice(2);
    let b = buckets[buckets.length-1];
    if(!b || b.label!==label){ b = {label, weeks:[]}; buckets.push(b); }
    b.weeks.push({kw:kwn, d:w.d, items:w.items});
  });
  const evCount = keys.reduce((a,k)=>a+gkc[k].items.length,0);
  return `
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span class="sectionTitle">Jahresplan</span>
        <span class="subMeta">${evCount} TERMINE</span>
      </div>
      <div class="footNote">Nur Termine der Klasse ${esc(ageClass)}, aus dem Gesamtkalender gefiltert.</div>
    </div>
    ${buckets.map(b=>`
      <div>
        <div class="monthHead"><span class="m">${esc(b.label)}</span></div>
        ${b.weeks.map(w=>`
          <div class="evRow">
            <div class="evKw"><span class="k">KW ${w.kw}</span><span class="d">${esc(w.d)}</span></div>
            <div class="evItems">${w.items.map(it=>`<div class="evItem"><span class="evChip">${esc(it.c)}</span><span class="evText">${esc(it.t)}</span></div>`).join('')}</div>
          </div>`).join('')}
      </div>`).join('')}
  `;
}

function renderStatistik(view){
  const isSolo = view.t==='a';
  if(!isSolo) return `<div class="empty"><div class="t1">Nur für Einzelpläne</div><div class="t2">Statistik gibt es für SPOGY-Athlet:innen mit Doku-Werten.</div></div>`;
  const W = D.WEEKS_BY_ATHLETE[view.id] || [];
  const filled = W.filter(w=>w.load>0);
  if(!W.length){
    return `<div class="empty">
      <div class="t1">Noch keine Doku-Werte</div>
      <div class="t2">Die Statistik rechnet mit Erschöpfung und Trainingsdauer aus der Einheitenplanung. Sobald Doku-Werte eingetragen sind, erscheinen Load und Verteilung hier.</div>
    </div>`;
  }
  const avg = (f)=>{ const v=filled.map(f).filter(x=>x!=null); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; };
  const kpis = [
    {l:'Ø Load / Woche', v: avg(w=>w.load), s:'Erschöpfung × Dauer'},
    {l:'Ø Erschöpfung', v: avg(w=>w.rpe), s:'Skala 1–10'},
    {l:'Ø Stunden', v: avg(w=>w.hrs), s:'pro Trainingswoche'},
    {l:'Ø Motivation', v: avg(w=>w.fit), s:'Skala 1–10'},
  ];
  const maxV = Math.max(1, ...W.map(w=>w.load||0));
  const cats = D.CATS_BY_VIEW['a:'+view.id] || [];
  const maxCat = Math.max(1, ...cats.map(c=>c.count));
  const totals = [
    {k:'Trainingsstunden gesamt', v: W.reduce((a,b)=>a+(b.hrs||0),0).toFixed(1)+' h'},
    {k:'Trainingstage dokumentiert', v: W.reduce((a,b)=>a+(b.days||0),0)},
    {k:'Load kumuliert', v: Math.round(W.reduce((a,b)=>a+(b.load||0),0))},
    {k:'Wochen ohne Eintrag', v: W.length-filled.length},
  ];
  return `
    <div class="kpiRow">${kpis.map(k=>`<div class="kpi"><span class="l">${esc(k.l)}</span><span class="v">${k.v==null?'-':(typeof k.v==='number'?k.v.toFixed(1):k.v)}</span><span class="s">${esc(k.s)}</span></div>`).join('')}</div>
    <div class="barChart">
      <span class="sectionTitle">Load pro Woche</span>
      <div class="bars">${W.map(w=>`<div class="barCol"><div class="bar" style="height:${Math.max(2,Math.round((w.load||0)/maxV*90))}px"></div><span class="barKw">${w.kw}</span></div>`).join('')}</div>
    </div>
    <div class="barChart">
      <span class="sectionTitle">Verteilung der Inhalte</span>
      ${cats.map(c=>`
        <div class="distRow">
          <div class="distTop"><span class="n">${esc(c.name)}</span><span class="c">${c.count}</span></div>
          <div class="distBarBg"><div class="distBarFg" style="width:${Math.round(c.count/maxCat*100)}%"></div></div>
        </div>`).join('')}
    </div>
    <div class="roster">
      <span style="font:500 9px/1 'Roboto Mono',monospace;letter-spacing:.08em;color:${DI};text-transform:uppercase">Gesamt</span>
      ${totals.map(t=>`<div style="display:flex;align-items:baseline;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(10,50,80,.08)"><span style="font:400 12px/1 Archivo,sans-serif;color:${MU}">${esc(t.k)}</span><span style="font:600 13px/1 'Roboto Mono',monospace">${esc(t.v)}</span></div>`).join('')}
    </div>
  `;
}

function renderBenchmarks(view){
  const isSolo = view.t==='a';
  if(!isSolo) return `<div class="empty"><div class="t1">Nur für Einzelpläne</div><div class="t2">Benchmarks gibt es für die 8 SPOGY-Athlet:innen.</div></div>`;
  const bench = D.BENCH[view.id];
  if(!bench){
    return `<div class="empty">
      <div class="t1">Noch keine Werte für ${esc(view.id)}</div>
      <div class="t2">Struktur steht: Technik+Taktik, Motorik, Physisches Klettertraining, Athletik. Sobald Werte in der Benchmark-Excel stehen, erscheinen sie hier.</div>
    </div>`;
  }
  return `
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
      <span class="sectionTitle">Benchmarks</span>
      <span class="subMeta">STAND ${esc(bench.stand)}</span>
    </div>
    ${bench.cats.map(c=>`
      <div class="card">
        <div class="benchCatHead"><span class="n">${esc(c.name)}</span><span class="r">${esc(c.rhythm)}</span></div>
        <div>${c.items.map(it=>`
          <div class="benchItem">
            <span class="benchK">${esc(it.k)}${it.auto?' (automatisch)':''}</span>
            <span class="benchV">${val(it.v)}</span>
          </div>`).join('')}</div>
      </div>`).join('')}
    <div class="footNote">Werte kommen aus der Benchmark-Excel. Fehlt ein Wert, steht hier "-" statt einer Erfindung.</div>
  `;
}

function renderKader(){
  const totalAthletes = D.GROUPS.reduce((a,g)=>a+g.athletes.length,0);
  return `
    <div style="display:flex;flex-direction:column;gap:4px">
      <span class="sectionTitle">Kader</span>
      <span class="subMeta">${totalAthletes} ATHLET:INNEN · ${D.GROUPS.length} GRUPPEN</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${D.GROUPS.map(g=>`
        <button class="groupRow" data-act="pickGroup" data-id="${esc(g.id)}">
          <span class="badge">${esc((GNAME[g.id]||g.id).replace(/\s/g,''))}</span>
          <span class="info">
            <span class="gn">${esc(GNAME[g.id]||g.id)}</span>
            <span class="gs">${g.athletes.length} Athlet:innen · ${esc(g.coaches||'-')}</span>
          </span>
          <span style="color:${DI}">›</span>
        </button>`).join('')}
    </div>
    <div class="roster">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
        <span style="font:600 12px/1 Archivo,sans-serif">Zugriff</span>
        <span style="font:400 9px/1 'Roboto Mono',monospace;color:${DI}">${D.COACHES.length} Personen</span>
      </div>
      ${D.COACHES.map(c=>`
        <div class="rosterRow">
          <span class="initials">${esc(c.n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase())}</span>
          <span style="flex:1;font:400 12.5px/1.2 Archivo,sans-serif;color:${TX}">${esc(c.n)}</span>
          <span class="roleChip ${c.r==='Headcoach'?'head':'coach'}">${esc(c.r)}</span>
        </div>`).join('')}
      <div class="footNote">Ein Link für alle — Headcoaches, Coaches und Athlet:innen sehen dieselben Ansichten.</div>
    </div>
  `;
}

function renderPicker(){
  const isSoloSel = state.view.t==='a';
  const groupOpts = D.GROUPS.filter(g=>g.id!=='SPOGY Gruppe').map(g=>`
    <button class="pickerOpt ${!isSoloSel && state.view.id===g.id?'sel':''}" data-act="pickView" data-t="g" data-id="${esc(g.id)}">
      <span class="info"><span class="n">${esc(GNAME[g.id]||g.id)}</span><span class="s">${g.athletes.length} Athlet:innen · ${esc(g.coaches||'-')}</span></span>
    </button>`).join('');
  const athleteOpts = (spogy ? spogy.athletes : []).map(a=>`
    <button class="pickerOpt ${isSoloSel && state.view.id===a.n?'sel':''}" data-act="pickView" data-t="a" data-id="${esc(a.n)}">
      <span class="info"><span class="n">${esc(a.n)}</span><span class="s">WK-Klasse 27: ${esc(a.wk||'-')}</span></span>
    </button>`).join('');
  return `
    <div class="overlay">
      <div class="overlayHead">
        <span class="overlayTitle">Ansicht wählen</span>
        <button class="closeBtn" data-act="closePicker">✕</button>
      </div>
      <div class="overlayBody">
        <div>
          <div class="pickerGroupLabel">Gruppenpläne</div>
          ${groupOpts}
        </div>
        <div>
          <div class="pickerGroupLabel">Einzelpläne SPOGY</div>
          ${athleteOpts}
        </div>
      </div>
    </div>
  `;
}

function wireEvents(){
  document.querySelectorAll('[data-act]').forEach(elm=>{
    elm.addEventListener('click', ()=>{
      const act = elm.getAttribute('data-act');
      if(act==='openPicker') setState({picker:true});
      else if(act==='closePicker') setState({picker:false});
      else if(act==='tab') setState({tab: elm.getAttribute('data-tab')});
      else if(act==='day') setState({day: parseInt(elm.getAttribute('data-i'),10), weekView:'tage'});
      else if(act==='weekview') setState({weekView: elm.getAttribute('data-wv')});
      else if(act==='prevWeek'){ const nw = addWeeks(state.year, state.kw, -1); setState({year:nw.year, kw:nw.kw, day:0}); }
      else if(act==='nextWeek'){ const nw = addWeeks(state.year, state.kw, 1); setState({year:nw.year, kw:nw.kw, day:0}); }
      else if(act==='pickView'){ setState({view:{t:elm.getAttribute('data-t'), id:elm.getAttribute('data-id')}, picker:false, tab:'Woche', day:0, year:NOW.year, kw:NOW.kw}); }
      else if(act==='pickGroup'){ setState({view:{t:'g', id:elm.getAttribute('data-id')}, tab:'Woche', day:0, year:NOW.year, kw:NOW.kw}); }
    });
  });
}

render();
</script>
</body>
</html>
