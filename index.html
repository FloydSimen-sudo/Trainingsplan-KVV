<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trainingspläne KVV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="./tp-data.js"></script>
<style>
  :root{
    --bg:#eef3f7; --bg2:#ffffff; --panel:#f5f8fb; --panel2:#e9eff5; --panel3:#e0e8f0; --panel4:#f7fafc;
    --tx:#0f2436; --tx2:#1f3a4d; --tx3:#33546a; --mu:#6b8496; --di:#9db0bd;
    --am:#00588f; --li:#128089; --red:#d20028; --orange:#f1774e;
    --border:rgba(10,50,80,.10); --border2:rgba(10,50,80,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--am);text-decoration:none}
  a:hover{color:#0a72b8}
  button{font-family:inherit}
  .mono{font-family:'Roboto Mono',monospace}
  #app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg2)}
  .header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 18px 12px;position:sticky;top:0;background:var(--bg2);z-index:5;border-bottom:1px solid var(--border)}
  .headerBtn{display:flex;align-items:center;gap:9px;background:transparent;border:none;padding:0;cursor:pointer;text-align:left;min-width:0}
  .viewName{font:600 19px/1.15 Archivo,sans-serif;letter-spacing:-.01em;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px}
  .viewSub{font:500 9.5px/1 'Roboto Mono',monospace;letter-spacing:.09em;color:var(--di)}
  .caret{font:700 20px/1 Archivo,sans-serif;color:var(--am);flex:none}
  .landing{display:flex;flex-direction:column;align-items:center;padding:44px 22px 24px;gap:6px;min-height:100vh}
  .landingLogo{width:min(78%,300px);height:auto;object-fit:contain;margin-bottom:10px}
  .landingTitle{font:700 24px/1.2 Archivo,sans-serif;color:var(--tx);text-align:center}
  .landingSub{font:500 12px/1.4 Archivo,sans-serif;color:var(--mu);text-align:center;margin-bottom:22px}
  .landingBody{width:100%;max-width:420px;display:flex;flex-direction:column;gap:22px}
  .syncbar{margin:12px 18px 4px;padding:9px 11px;border-radius:12px;background:var(--panel4);border:1px solid var(--border);display:flex;align-items:center;gap:9px}
  .dot{width:7px;height:7px;border-radius:4px;flex:none;background:var(--li);box-shadow:0 0 0 3px rgba(18,128,137,.15)}
  .syncFile{font:500 10px/1.2 'Roboto Mono',monospace;letter-spacing:.04em;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .syncInfo{font:400 9.5px/1.2 'Roboto Mono',monospace;color:var(--di)}
  .content{flex:1;padding:14px 18px 10px;display:flex;flex-direction:column;gap:14px}
  .weekNav{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .navBtn{width:32px;height:32px;border-radius:10px;background:var(--panel);border:1px solid var(--border2);color:var(--mu);font:400 15px/1 Archivo;cursor:pointer}
  .navBtn:hover{background:var(--panel3);color:var(--tx)}
  .weekTitle{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
  .weekKw{font:600 15px/1 Archivo,sans-serif}
  .weekMeta{font:500 9.5px/1.3 'Roboto Mono',monospace;letter-spacing:.06em;color:var(--di);text-align:center}
  .dayChips{display:flex;gap:6px}
  .dayChip{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 7px;border-radius:12px;cursor:pointer;font-family:Archivo,sans-serif;background:var(--panel);border:1px solid var(--border2);color:var(--mu)}
  .dayChip.sel{background:var(--tx3);color:var(--bg2);border-color:transparent}
  .dayChip .dow{font:500 9px/1 'Roboto Mono',monospace;letter-spacing:.06em;opacity:.75}
  .dayChip .dom{font:600 14px/1 Archivo,sans-serif}
  .dayHead{display:flex;align-items:baseline;gap:8px}
  .dayTitle{font:600 16px/1.2 Archivo,sans-serif}
  .metaRow{display:flex;flex-wrap:wrap;gap:6px}
  .metaPill{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;background:var(--panel);border:1px solid var(--border)}
  .metaPill .k{font:500 9px/1 'Roboto Mono',monospace;letter-spacing:.08em;color:var(--di);text-transform:uppercase}
  .metaPill .v{font:500 11px/1 Archivo,sans-serif;color:var(--tx3)}
  .card{border-radius:16px;background:var(--panel);border:1px solid var(--border);overflow:hidden}
  .cardHead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--panel2);border-bottom:1px solid var(--border)}
  .cardHead .name{display:flex;align-items:center;gap:9px;font:600 12px/1 Archivo,sans-serif;letter-spacing:.02em}
  .cardHead .dotSm{width:6px;height:6px;border-radius:3px;background:var(--li)}
  .cardHead .time{font:500 10px/1 'Roboto Mono',monospace;color:var(--mu)}
  .slotRow{display:grid;grid-template-columns:100px 1fr;gap:10px;width:100%;padding:11px 14px;border-bottom:1px solid rgba(10,50,80,.08);text-align:left}
  .slotRow:last-child{border-bottom:none}
  .slotK{font:500 9px/1.35 'Roboto Mono',monospace;letter-spacing:.06em;color:var(--di);text-transform:uppercase;padding-top:3px}
  .slotName{font:500 13px/1.35 Archivo,sans-serif;color:var(--tx);text-wrap:pretty}
  .slotMeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .metaTag{padding:3px 7px;border-radius:6px;font:500 9.5px/1 'Roboto Mono',monospace;letter-spacing:.03em;background:var(--panel3);color:var(--mu)}
  .metaTag.hi{background:rgba(18,128,137,.12);color:var(--li)}
  .empty{border-radius:16px;background:var(--panel4);border:1px dashed var(--border2);padding:22px 16px;display:flex;flex-direction:column;gap:9px}
  .empty .t1{font:600 13px/1.2 Archivo,sans-serif;color:var(--tx3)}
  .empty .t2{font:400 12px/1.5 Archivo,sans-serif;color:var(--mu);text-wrap:pretty}
  .dashed{border-radius:12px;border:1px dashed var(--border2);padding:14px 16px;font:400 13px/1.4 Archivo,sans-serif;color:var(--di)}
  .dokuBlock{border-radius:16px;background:var(--panel);border:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:14px}
  .scaleLabel{display:flex;align-items:baseline;justify-content:space-between}
  .scaleLabel .l{font:500 10px/1 'Roboto Mono',monospace;letter-spacing:.07em;color:var(--mu);text-transform:uppercase}
  .scaleLabel .v{font:600 13px/1 'Roboto Mono',monospace;color:var(--am)}
  .cells{display:flex;gap:3px}
  .cell{flex:1;height:20px;border-radius:5px;background:var(--panel3)}
  .cell.on{background:var(--am)}
  .durRow{display:flex;gap:10px}
  .durBox{flex:1;padding:10px 12px;border-radius:12px;background:var(--panel3);display:flex;flex-direction:column;gap:4px}
  .durBox .k{font:500 9px/1 'Roboto Mono',monospace;letter-spacing:.07em;color:var(--di);text-transform:uppercase}
  .durBox .v{font:600 15px/1 Archivo,sans-serif}
  .loadRow{display:flex;align-items:center;justify-content:space-between}
  .loadRow .k{font:500 10px/1 'Roboto Mono',monospace;letter-spacing:.07em;color:var(--di);text-transform:uppercase}
  .loadRow .v{font:600 15px/1 'Roboto Mono',monospace;color:var(--li)}
  .noteBlock{border-radius:16px;background:var(--panel4);border:1px dashed var(--border2);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
  .noteBlock .l{font:500 9px/1 'Roboto Mono',monospace;letter-spacing:.08em;color:var(--di);text-transform:uppercase}
  .noteBlock .t{font:400 12.5px/1.45 Archivo,sans-serif;color:var(--mu);text-wrap:pretty}
  .tabs{display:flex;gap:3px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--border);position:sticky;bottom:0}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 0;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--di);cursor:pointer}
  .tab.sel{border-color:rgba(0,88,143,.35);background:rgba(0,88,143,.1);color:var(--am)}
  .tab .icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center}
  .tab .icon svg{width:18px;height:18px;display:block}
  .tab .lbl{font:500 8.5px/1 'Roboto Mono',monospace;letter-spacing:.04em}
  .sectionTitle{font:600 13px/1 Archivo,sans-serif}
  .subMeta{font:500 10px/1 'Roboto Mono',monospace;color:var(--di)}
  .monthHead{position:sticky;top:0;z-index:2;padding:8px 0;background:var(--bg2);display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--border)}
  .monthHead .m{font:600 11px/1 'Roboto Mono',monospace;letter-spacing:.12em;color:var(--tx);text-transform:uppercase}
  .evRow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(10,50,80,.08)}
  .evKw{width:56px;flex:none;display:flex;flex-direction:column;gap:3px}
  .evKw .k{font:600 11.5px/1 'Roboto Mono',monospace;color:var(--tx)}
  .evKw .d{font:400 8.5px/1.2 'Roboto Mono',monospace;color:var(--di)}
  .evItems{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
  .evItem{display:flex;align-items:flex-start;gap:8px}
  .evChip{padding:3px 7px;border-radius:6px;flex:none;font:500 8.5px/1 'Roboto Mono',monospace;letter-spacing:.05em;text-transform:uppercase;background:rgba(139,151,168,.18);color:var(--mu)}
  .evText{font:400 12px/1.35 Archivo,sans-serif;color:var(--tx2);text-wrap:pretty}
  .kpiRow{display:flex;gap:10px;flex-wrap:wrap}
  .kpi{flex:1;min-width:120px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--border);display:flex;flex-direction:column;gap:5px}
  .kpi .l{font:500 8.5px/1.2 'Roboto Mono',monospace;letter-spacing:.07em;color:var(--di);text-transform:uppercase}
  .kpi .v{font:600 21px/1 Archivo,sans-serif;letter-spacing:-.02em}
  .kpi .s{font:500 9.5px/1 'Roboto Mono',monospace;color:var(--mu)}
  .barChart{padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--border);display:flex;flex-direction:column;gap:12px}
  .bars{display:flex;align-items:flex-end;gap:4px;height:110px;overflow-x:auto}
  .barCol{flex:1;min-width:14px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
  .bar{width:100%;border-radius:3px 3px 1px 1px;background:rgba(18,128,137,.65)}
  .barKw{font:500 8px/1 'Roboto Mono',monospace;color:var(--di)}
  .distRow{display:flex;flex-direction:column;gap:5px}
  .distTop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .distTop .n{font:500 11px/1.3 Archivo,sans-serif;color:var(--tx2)}
  .distTop .c{font:500 10px/1 'Roboto Mono',monospace;color:var(--mu)}
  .distBarBg{height:6px;border-radius:3px;background:var(--panel3);overflow:hidden}
  .distBarFg{height:100%;border-radius:3px;background:var(--li)}
  .benchCatHead{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--panel2);border-bottom:1px solid var(--border)}
  .benchCatHead .n{font:600 12px/1.2 Archivo,sans-serif}
  .benchCatHead .r{font:500 9px/1 'Roboto Mono',monospace;letter-spacing:.06em;color:var(--di);text-transform:uppercase}
  .benchItem{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(10,50,80,.08)}
  .benchItem:last-child{border-bottom:none}
  .benchK{flex:1;font:400 12.5px/1.3 Archivo,sans-serif;color:var(--tx2)}
  .benchV{font:600 14px/1 'Roboto Mono',monospace;color:var(--tx);min-width:56px;text-align:right}
  .roster{padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--border);display:flex;flex-direction:column;gap:9px}
  .rosterRow{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid rgba(10,50,80,.08)}
  .rosterRow:last-child{border-bottom:none}
  .initials{width:26px;height:26px;flex:none;border-radius:13px;background:var(--panel3);display:flex;align-items:center;justify-content:center;font:600 9.5px/1 'Roboto Mono',monospace;color:var(--mu)}
  .roleChip{padding:3px 7px;border-radius:6px;flex:none;font:500 8.5px/1 'Roboto Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
  .roleChip.head{background:rgba(0,88,143,.14);color:var(--am)}
  .roleChip.coach{background:var(--panel3);color:var(--di)}
  .groupRow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 13px;border-radius:14px;cursor:pointer;background:var(--panel);border:1px solid var(--border)}
  .groupRow .badge{width:38px;height:34px;flex:none;border-radius:11px;background:var(--panel3);display:flex;align-items:center;justify-content:center;font:600 10px/1 'Roboto Mono',monospace;color:var(--mu)}
  .groupRow .info{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
  .groupRow .gn{font:500 13px/1.15 Archivo,sans-serif;color:var(--tx)}
  .groupRow .gs{font:400 9.5px/1.3 'Roboto Mono',monospace;color:var(--di)}
  .overlay{position:fixed;inset:0;z-index:20;background:rgba(10,30,45,.82);backdrop-filter:blur(7px);display:flex;flex-direction:column;padding:24px 0}
  .overlayHead{display:flex;align-items:center;justify-content:space-between;padding:0 18px 12px;max-width:560px;width:100%;margin:0 auto}
  .overlayTitle{font:600 16px/1 Archivo,sans-serif;color:#fff}
  .closeBtn{width:32px;height:32px;border-radius:16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);color:#fff;font:400 14px/1 Archivo;cursor:pointer}
  .overlayBody{flex:1;overflow:auto;padding:0 18px;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
  .pickerGroupLabel{font:500 9px/1 'Roboto Mono',monospace;letter-spacing:.08em;color:var(--di);text-transform:uppercase;margin-bottom:8px}
  .pickerOpt{display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;border-radius:13px;cursor:pointer;text-align:left;background:var(--panel);border:1px solid var(--border);color:var(--tx);margin-bottom:6px}
  .pickerOpt.sel{background:rgba(0,88,143,.1);border-color:rgba(0,88,143,.35)}
  .pickerOpt .info{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
  .pickerOpt .n{font:500 13px/1.15 Archivo,sans-serif}
  .pickerOpt .s{font:400 9.5px/1.3 'Roboto Mono',monospace;color:var(--di)}
  .footNote{font:400 10.5px/1.5 'Roboto Mono',monospace;color:var(--di);text-wrap:pretty;padding-bottom:8px}
  .intro{padding:16px 18px 4px;display:flex;flex-direction:column;gap:6px}
  .intro .eyebrow{font:500 11px/1 'Roboto Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--am)}
  .intro .desc{font:400 12.5px/1.5 Archivo,sans-serif;color:var(--mu);text-wrap:pretty}
  .brandMark{flex:none;width:28px;height:28px;object-fit:contain}
  .headerLogo{flex:none;height:26px;width:auto;object-fit:contain}
  .weekview{display:flex;gap:6px;padding:2px;border-radius:12px;background:var(--panel);border:1px solid var(--border2)}
  .weekviewBtn{flex:1;padding:7px 0;border-radius:10px;border:none;background:transparent;color:var(--mu);font:500 10.5px/1 'Roboto Mono',monospace;letter-spacing:.04em;cursor:pointer}
  .weekviewBtn.sel{background:var(--am);color:#fff}
  .kurzTable{display:flex;flex-direction:column;gap:6px}
  .kurzRow{display:flex;align-items:stretch;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;cursor:pointer;background:var(--panel);border:1px solid var(--border)}
  .kurzRow.today{border-color:rgba(0,88,143,.4);background:rgba(0,88,143,.06)}
  .kurzDay{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .kurzDay .dow{font:600 9px/1 'Roboto Mono',monospace;letter-spacing:.05em;color:var(--di)}
  .kurzDay .dom{font:600 14px/1 Archivo,sans-serif;color:var(--tx)}
  .kurzBody{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
  .kurzOrt{font:500 10px/1.2 'Roboto Mono',monospace;color:var(--mu)}
  .kurzCats{display:flex;flex-wrap:wrap;gap:5px}
  .kurzCat{padding:3px 7px;border-radius:6px;font:500 9px/1 'Roboto Mono',monospace;letter-spacing:.02em;background:var(--panel3);color:var(--tx3)}
  .kurzNone{font:400 12px/1.4 Archivo,sans-serif;color:var(--di)}
  .ribbonWrap{display:flex;gap:1px;align-items:flex-end;overflow-x:auto;padding:6px 2px 14px}
  .ribbonCol{flex:none;width:22px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .ribbonLbl{font:500 8px/1 'Roboto Mono',monospace;color:var(--di);white-space:nowrap}
  .ribbonLbl.month{color:var(--tx);font-weight:700;font-size:8.5px}
  .ribbonBar{width:18px;border-radius:2px;height:34px;background:#eef3f7}
  .ribbonBar.empty{background:#eef3f7}
  .ribbonBar.cur{outline:2px solid var(--am);outline-offset:1px}
  .legendRow{display:flex;flex-wrap:wrap;gap:10px 14px}
  .legendItem{display:flex;align-items:center;gap:5px;font:500 9.5px/1 'Roboto Mono',monospace;color:var(--mu)}
  .legendSwatch{width:9px;height:9px;border-radius:2px;flex:none}
  .phaseChip{padding:3px 8px;border-radius:7px;font:600 9.5px/1 'Roboto Mono',monospace;letter-spacing:.05em;text-transform:uppercase;flex:none}
  .reduTag{padding:2px 6px;border-radius:5px;font:500 8px/1 'Roboto Mono',monospace;letter-spacing:.04em;color:var(--di);border:1px dashed var(--border2);flex:none}
  .jahrRowHead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app"></div>
<script>
const AM='#00588f', LI='#128089', TX='#0f2436', MU='#6b8496', DI='#9db0bd';
// Trainingsort-Farbe, 1:1 wie von Floyd vorgegeben und identisch zur Farbe im
// Jahr-Ribbon der Gruppen: Grün=Lead, Blau=Bouldern, Gelb=Speed.
const ORT_COLORS = { Lead: '#78b83f', Bouldern: '#0090c9', Speed: '#c9a227' };
const TAB_ICONS = {
  Woche: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/><rect x="7" y="13.5" width="4" height="4" fill="currentColor" stroke="none"/></svg>',
  Jahr: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="3" y="4.5" width="18" height="3.2" rx="1.4"/><rect x="3" y="10.4" width="11" height="3.2" rx="1.4"/><rect x="3" y="16.3" width="15" height="3.2" rx="1.4"/></svg>',
  Statistik: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M12 20V4M20 20v-6"/></svg>',
  Benchmarks: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="4.2"/><circle cx="12" cy="12" r="0.9" fill="currentColor" stroke="none"/></svg>',

// ---- ISO Woche ----
function isoWeekMonday(year, week){
  const simple = new Date(Date.UTC(year,0,1+(week-1)*7));
  const dow = simple.getUTCDay() || 7;
  const monday = new Date(simple);
  if(dow<=4) monday.setUTCDate(simple.getUTCDate()-dow+1); else monday.setUTCDate(simple.getUTCDate()+8-dow);
  return monday;
}
function getISOWeek(date){
  const d = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
  const dayNum = (d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-dayNum+3);
  const firstThu = new Date(Date.UTC(d.getUTCFullYear(),0,4));
  const week = 1+Math.round(((d-firstThu)/86400000-3+((firstThu.getUTCDay()+6)%7))/7);
  return {year: d.getUTCFullYear(), kw: week};
}
function addWeeks(year, kw, delta){
  const d = isoWeekMonday(year, kw);
  d.setUTCDate(d.getUTCDate()+delta*7);
  return getISOWeek(d);
}
const NOW = getISOWeek(new Date());

  const el = document.getElementById('app');

  }
}

  const plan = plans[wkKey] || null;

  const di = Math.min(state.day, Math.max(0, days.length-1));
  const day = days[di] || null;

  const dayChips = days.map((dd,i)=>{
    const oc = ORT_COLORS[dd.ortType];
    return `

  if(day && day.trainer) dayMeta.push({k:'Trainer', v:day.trainer});

    const m = it.match;
    const chips = [];

      if(m.sets!=null && m.sets!=='' && m.sets!=='x') chips.push(`<span class="metaTag">${esc(m.sets)}</span>`);
      if(m.vol!=null && m.vol!=='' && m.vol!=='x') chips.push(`<span class="metaTag">${esc(m.vol)}</span>`);
      if(m.pause!=null && m.pause!=='' && m.pause!=='x') chips.push(`<span class="metaTag">Pause ${esc(m.pause)}</span>`);

    return `<div class="slotName">${esc(it.ex)}</div>${chips.length ? `<div class="slotMeta">${chips.join('')}</div>` : ''}`;
  };

  const sessionsHtml = (day && day.sessions ? day.sessions : []).map(s=>`
    <div class="card">

        ${s.time ? `<span class="time">${esc(s.time)}</span>` : ''}

      <div>
        ${ (s.cats || []).map(cat=>`
          <div class="slotRow">

  const dk = day && day.doku ? day.doku : null;
  const scale = (label, v)=>{
    const n = (typeof v === 'number') ? Math.round(v) : 0;
    return `<div style="display:flex;flex-direction:column;gap:7px">
      <div class="scaleLabel"><span class="l">${label}</span><span class="v">${val(v)} / 10</span></div>
      <div class="cells">${Array.from({length:10},(_,i)=>`<div class="cell ${i<n?'on':''}"></div>`).join('')}</div>

  };
  const dl = dk ? (parseFloat(dk.d1)||0) + (parseFloat(dk.d2)||0) : 0;
  const dayLoad = (dk && typeof dk.ee === 'number') ? Math.round(dl*dk.ee*10)/10 : null;

  return `

      </div>
      <button class="navBtn" data-act="nextWeek">›</button>

    ${!plan ? `<div class="empty">

        <div class="t2">Sobald die Woche in der Einheitenplanung steht, erscheint sie hier beim nächsten Update.</div>

          </div>
          <div class="loadRow"><span class="k">Load</span><span class="v">${val(dayLoad)}</span></div>
        </div>` : ''}
      `}
    `}
  `;
}

function renderKurz(days, di){
  return (days||[]).map((dd,i)=>{
    const hasSessions = dd.sessions && dd.sessions.length;
    let body = `<span class="kurzNone">-</span>`;
    if(hasSessions){
      const catNames = [];
      dd.sessions.forEach(s=>{
        (s.cats||[]).forEach(cat=>{
          if(cat.items && cat.items.length && catNames.indexOf(cat.name)<0) catNames.push(cat.name);
        });
      });
      body = catNames.length
        ? `<div class="kurzCats">${catNames.map(n=>`<span class="kurzCat">${esc(n)}</span>`).join('')}</div>`
        : `<span class="kurzNone">-</span>`;
    }
    const oc = ORT_COLORS[dd.ortType];
    const metaBits = [];
    if(dd.ort) metaBits.push(esc(dd.ort));
    if(dd.zeit) metaBits.push(esc(dd.zeit));
    if(dd.trainer) metaBits.push(esc(dd.trainer));
    return `<button class="kurzRow ${i===di?'today':''}" data-act="day" data-i="${i}" style="${oc?`border-left:4px solid ${oc}`:''}">
      <div class="kurzDay"><span class="dow">${esc((dd.dow||'').slice(0,2).toUpperCase())}</span><span class="dom">${esc(dd.dom)}</span></div>
      <div class="kurzBody">
        ${metaBits.length ? `<span class="kurzOrt">${metaBits.join(' · ')}</span>` : ''}
        ${body}
      </div>
    </button>`;
  }).join('');
}

function renderJahr(view, isSolo, athlete, group){
  const jp = isSolo ? D.JAHRESPLAN[view.id] : D.JAHRESPLAN_GROUP[view.id];
  const src = isSolo ? D.JAHRESPLAN_SOURCE[view.id] : D.JAHRESPLAN_GROUP_SOURCE[view.id];
  if(jp && jp.length) return renderJahrPhasen(view, jp, src || '-');
  return renderJahrEvents(view, isSolo, athlete, group);
}

// Reine Grafik-Ansicht: Kalenderwochen fortlaufend (scrollbar), Phasenfarbe
// 1:1 aus der Excel-Zellfarbe der jeweiligen Jahresplanung/Fokus-Zeile —
// keine erfundene Farbzuordnung. Termine/Notizen werden hier bewusst
// (noch) nicht angezeigt, nur die Grafik (Floyds Vorgabe).
function renderJahrPhasen(view, weeks, src){
  const withMeta = weeks.slice().sort((a,b)=>(a.year-b.year)||(a.kw-b.kw)).map(w=>{
    const mon = isoWeekMonday(w.year, w.kw);
    const cur = w.year===NOW.year && w.kw===NOW.kw;
    return Object.assign({}, w, {mon, cur});
  });

  let lastMonth = null;
  const cols = withMeta.map(w=>{
    const m = w.mon.getUTCMonth();
    const isMonthStart = m !== lastMonth;
    lastMonth = m;
    const label = isMonthStart ? MNAMES[m] : String(w.kw);
    const barStyle = w.phaseColor ? `background:${esc(w.phaseColor)}` : '';
    const title = 'KW ' + w.kw + ' · ' + (w.year) + ' · ' + esc(w.phase || w.phaseRaw || 'kein Eintrag');
    return `<div class="ribbonCol">
      <span class="ribbonLbl ${isMonthStart?'month':''}">${esc(label)}</span>
      <div class="ribbonBar ${w.cur?'cur':''} ${!w.phaseColor?'empty':''}" style="${barStyle}" title="${title}"></div>
    </div>`;
  }).join('');

  const legendMap = new Map();
  withMeta.forEach(w=>{ if(w.phase && w.phaseColor && !legendMap.has(w.phase)) legendMap.set(w.phase, w.phaseColor); });
  const legend = Array.from(legendMap.entries()).map(([label,color])=>
    `<div class="legendItem"><span class="legendSwatch" style="background:${esc(color)}"></span>${esc(label)}</div>`).join('');

  return `
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span class="sectionTitle">Jahresplan</span>
        <span class="subMeta">${withMeta.length} WOCHEN</span>
      </div>
      <div class="footNote">${esc(src)}. Farben 1:1 aus der Excel-Jahresplanung übernommen — Wochen ohne Farbeintrag bleiben neutral, keine erfundenen Werte. Termine folgen später.</div>
    </div>
    <div class="ribbonWrap" id="jahrRibbon">${cols}</div>
    <div class="legendRow">${legend}</div>
  `;
}

function renderJahrEvents(view, isSolo, athlete, group){
  const ageClass = isSolo ? WKCLASS_TO_AGE(athlete ? athlete.wk : null) : (GCLASS[view.id] || 'U15');
  const gkc = D.GK[ageClass] || {};
  const keys = Object.keys(gkc).sort((a,b)=>{ const A=a.split('-').map(Number), B=b.split('-').map(Number); return (A[0]-B[0])||(A[1]-B[1]); });
  if(!keys.length){
    return `<div class="empty">
      <div class="t1">Keine Termine für Klasse ${esc(ageClass)}</div>
      <div class="t2">Sobald im Gesamtkalender Termine für diese Wettkampfklasse eingetragen sind, erscheinen sie hier.</div>
    </div>`;
  }
  const buckets = [];
  keys.forEach(k=>{
    const w = gkc[k];
    const [y,kwn] = k.split('-').map(Number);
    const mon = isoWeekMonday(y,kwn).getUTCMonth();
    const label = MNAMES[mon] + ' ' + String(y).slice(2);
    let b = buckets[buckets.length-1];
    if(!b || b.label!==label){ b = {label, weeks:[]}; buckets.push(b); }
    b.weeks.push({kw:kwn, d:w.d, items:w.items});
  });
  const evCount = keys.reduce((a,k)=>a+gkc[k].items.length,0);
  return `
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span class="sectionTitle">Jahresplan</span>
        <span class="subMeta">${evCount} TERMINE</span>
      </div>
      <div class="footNote">Nur Termine der Klasse ${esc(ageClass)}, aus dem Gesamtkalender gefiltert.</div>
    </div>
    ${buckets.map(b=>`
      <div>
        <div class="monthHead"><span class="m">${esc(b.label)}</span></div>
        ${b.weeks.map(w=>`
          <div class="evRow">
            <div class="evKw"><span class="k">KW ${w.kw}</span><span class="d">${esc(w.d)}</span></div>
            <div class="evItems">${w.items.map(it=>`<div class="evItem"><span class="evChip">${esc(it.c)}</span><span class="evText">${esc(it.t)}</span></div>`).join('')}</div>
          </div>`).join('')}
      </div>`).join('')}
  `;
}

function renderStatistik(view){
  const isSolo = view.t==='a';
  const key = (isSolo?'a:':'g:') + view.id;
  const seasons = D.SEASONS && D.SEASONS.length ? D.SEASONS : [D.SEASON_LABEL||'25/26'];
  const season = seasons.includes(state.statSeason) ? state.statSeason : seasons[0];
  const seasonToggle = seasons.length > 1 ? `
    <div class="weekview">
      ${seasons.map(s=>`<button class="weekviewBtn ${season===s?'sel':''}" data-act="statseason" data-season="${esc(s)}">Saison ${esc(s)}</button>`).join('')}
    </div>` : '';
  const statsForSeason = D.SEASON_STATS[season] || {};
  const ss = statsForSeason[key];
  if(!ss){
    return `${seasonToggle}<div class="empty">
      <div class="t1">Keine Saison-Daten hinterlegt</div>
      <div class="t2">Für Saison ${esc(season)} liegt keine Einheitenplanung im Testspace-Ordner vor.</div>
    </div>`;
  }
  const cats = ss.catCounts || [];
  const maxCat = Math.max(1, ...cats.map(c=>c.count));
  const W = (ss.weeks || []).slice().sort((a,b)=>(a.year-b.year)||(a.kw-b.kw));
  const filled = W.filter(w=>w.load>0);
  const showLoad = filled.length >= 10;

  const loadNote = isSolo
    ? `Load-Verlauf gibt es nur, wo RPE und Trainingsdauer nach jeder Einheit vollständig dokumentiert werden (aktuell: Adrian Kathan). Bei ${esc(view.id)} reicht die Doku-Abdeckung dafür noch nicht.`
    : `Gruppenpläne erfassen kein individuelles RPE/Trainingsdauer pro Athlet:in — Load-Verlauf gibt es daher nur bei Einzelplänen mit vollständiger Doku (aktuell: Adrian Kathan).`;
  let loadSection = `<div class="dashed">${loadNote}</div>`;
  if(showLoad){
    const maxV = Math.max(1, ...W.map(w=>w.load||0));
    const last4 = filled.slice(-4);
    const acute = last4.length ? last4[last4.length-1].load : null;
    const chronic = last4.length ? last4.reduce((a,b)=>a+b.load,0)/last4.length : null;
    const acwr = (acute!=null && chronic) ? acute/chronic : null;
    loadSection = `
      <div class="barChart">
        <div style="display:flex;align-items:baseline;justify-content:space-between"><span class="sectionTitle">Load pro Woche</span><span class="subMeta">LOAD</span></div>
        <div class="bars">${W.map(w=>`<div class="barCol"><div class="bar" style="height:${Math.max(2,Math.round((w.load||0)/maxV*90))}px"></div><span class="barKw">${w.kw}</span></div>`).join('')}</div>
        <div class="loadRow"><span class="k">ACWR (1 : 4 Wochen)</span><span class="v" style="color:${AM}">${acwr==null?'-':acwr.toFixed(2)}</span></div>
      </div>`;
  }

  const grpEstNote = (!isSolo && ss.trainingDays!=null)
    ? `Trainingsstunden bei Gruppen sind geschätzt: ${esc(ss.estHoursPerDay)} h × Trainingstage (Gruppen erfassen keine echte Dauer). Ein Trainingstag zählt, wenn an dem Tag mindestens eine Kategorie unterhalb "Trainingsort" befüllt ist — Notizen zählen nicht.`
    : null;

  const totals = isSolo
    ? [
        {k:'Trainingsstunden (Saison)', v: W.length ? W.reduce((a,b)=>a+(b.hrs||0),0).toFixed(1)+' h' : '-'},
        {k:'Trainingstage dokumentiert', v: W.length ? W.reduce((a,b)=>a+(b.days||0),0) : '-'},
        {k:'Load kumuliert', v: showLoad ? Math.round(W.reduce((a,b)=>a+(b.load||0),0)) : '-'},
        {k:'Wochen ohne Load-Eintrag', v: showLoad ? (W.length-filled.length) : '-'},
      ]
    : [
        {k:'Trainingsstunden (Saison, geschätzt)', v: ss.estHours!=null ? ss.estHours.toFixed(1)+' h' : '-'},
        {k:'Trainingstage dokumentiert', v: ss.trainingDays!=null ? ss.trainingDays : '-'},
      ];

  return `
    <div style="display:flex;align-items:baseline;justify-content:space-between">
      <span class="sectionTitle">Statistik</span>
      <span class="subMeta">SAISON ${esc(season)}</span>
    </div>
    ${seasonToggle}
    ${loadSection}
    <div class="barChart">
      <span class="sectionTitle">Verteilung der Inhalte</span>
      ${cats.map(c=>`
        <div class="distRow">
          <div class="distTop"><span class="n">${esc(c.name)}</span><span class="c">${c.count}</span></div>
          <div class="distBarBg"><div class="distBarFg" style="width:${Math.round(c.count/maxCat*100)}%"></div></div>
        </div>`).join('')}
      <div class="footNote">Zählt reale Einträge in den Übungszellen der Einheitenplanung Saison ${esc(season)} (${esc(ss.sheet||'-')}) — keine Schätzung.</div>
    </div>
    <div class="roster">
      <span style="font:500 9px/1 'Roboto Mono',monospace;letter-spacing:.08em;color:${DI};text-transform:uppercase">Saison ${esc(season)} Gesamt</span>
      ${totals.map(t=>`<div style="display:flex;align-items:baseline;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(10,50,80,.08)"><span style="font:400 12px/1 Archivo,sans-serif;color:${MU}">${esc(t.k)}</span><span style="font:600 13px/1 'Roboto Mono',monospace">${esc(t.v)}</span></div>`).join('')}
      ${grpEstNote ? `<div class="footNote" style="padding-top:6px">${esc(grpEstNote)}</div>` : ''}
    </div>
  `;
}

function renderBenchmarks(view){
  const isSolo = view.t==='a';
  if(!isSolo) return `<div class="empty"><div class="t1">Nur für Einzelpläne</div><div class="t2">Benchmarks gibt es für die 8 SPOGY-Athlet:innen.</div></div>`;
  const bench = D.BENCH[view.id];
  if(!bench){
    return `<div class="empty">
      <div class="t1">Noch keine Werte für ${esc(view.id)}</div>
      <div class="t2">Struktur steht: Technik+Taktik, Motorik, Physisches Klettertraining, Athletik. Sobald Werte in der Benchmark-Excel stehen, erscheinen sie hier.</div>
    </div>`;
  }
  return `
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
      <span class="sectionTitle">Benchmarks</span>
      <span class="subMeta">STAND ${esc(bench.stand)}</span>
    </div>
    ${bench.cats.map(c=>`
      <div class="card">
        <div class="benchCatHead"><span class="n">${esc(c.name)}</span><span class="r">${esc(c.rhythm)}</span></div>
        <div>${c.items.map(it=>`
          <div class="benchItem">
            <span class="benchK">${esc(it.k)}${it.auto?' (automatisch)':''}</span>
            <span class="benchV">${val(it.v)}</span>
          </div>`).join('')}</div>
      </div>`).join('')}
    <div class="footNote">Werte kommen aus der Benchmark-Excel. Fehlt ein Wert, steht hier "-" statt einer Erfindung.</div>
  `;
}

function renderKader(){
  const totalAthletes = D.GROUPS.reduce((a,g)=>a+g.athletes.length,0);
  return `
    <div style="display:flex;flex-direction:column;gap:4px">
      <span class="sectionTitle">Kader</span>
      <span class="subMeta">${totalAthletes} ATHLET:INNEN · ${D.GROUPS.length} GRUPPEN</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${D.GROUPS.map(g=>`
        <button class="groupRow" data-act="pickGroup" data-id="${esc(g.id)}">
          <span class="badge">${esc((GNAME[g.id]||g.id).replace(/\s/g,''))}</span>
          <span class="info">
            <span class="gn">${esc(GNAME[g.id]||g.id)}</span>
            <span class="gs">${g.athletes.length} Athlet:innen · ${esc(g.coaches||'-')}</span>
          </span>
          <span style="color:${DI}">›</span>
        </button>`).join('')}
    </div>
    <div class="roster">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
        <span style="font:600 12px/1 Archivo,sans-serif">Zugriff</span>
        <span style="font:400 9px/1 'Roboto Mono',monospace;color:${DI}">${D.COACHES.length} Personen</span>
      </div>
      ${D.COACHES.map(c=>`
        <div class="rosterRow">
          <span class="initials">${esc(c.n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase())}</span>
          <span style="flex:1;font:400 12.5px/1.2 Archivo,sans-serif;color:${TX}">${esc(c.n)}</span>
          <span class="roleChip ${c.r==='Headcoach'?'head':'coach'}">${esc(c.r)}</span>
        </div>`).join('')}
      <div class="footNote">Ein Link für alle — Headcoaches, Coaches und Athlet:innen sehen dieselben Ansichten.</div>
    </div>
  `;
}

function renderPickOpts(selView){
  const isSoloSel = selView && selView.t==='a';
  const groupOpts = D.GROUPS.filter(g=>g.id!=='SPOGY Gruppe').map(g=>`
    <button class="pickerOpt ${selView && !isSoloSel && selView.id===g.id?'sel':''}" data-act="pickView" data-t="g" data-id="${esc(g.id)}">
      <span class="info"><span class="n">${esc(GNAME[g.id]||g.id)}</span><span class="s">${g.athletes.length} Athlet:innen · ${esc(g.coaches||'-')}</span></span>
    </button>`).join('');
  const athleteOpts = (spogy ? spogy.athletes : []).map(a=>`
    <button class="pickerOpt ${selView && isSoloSel && selView.id===a.n?'sel':''}" data-act="pickView" data-t="a" data-id="${esc(a.n)}">
      <span class="info"><span class="n">${esc(a.n)}</span><span class="s">WK-Klasse 27: ${esc(a.wk||'-')}</span></span>
    </button>`).join('');
  return { groupOpts, athleteOpts };
}

function renderPicker(){
  const { groupOpts, athleteOpts } = renderPickOpts(state.view);
  return `
    <div class="overlay">
      <div class="overlayHead">
        <span class="overlayTitle">Ansicht wählen</span>
        <button class="closeBtn" data-act="closePicker">✕</button>
      </div>
      <div class="overlayBody">
        <div>
          <div class="pickerGroupLabel">Gruppenpläne</div>
          ${groupOpts}
        </div>
        <div>
          <div class="pickerGroupLabel">Einzelpläne SPOGY</div>
          ${athleteOpts}
        </div>
      </div>
    </div>
  `;
}

function renderLanding(){
  const { groupOpts, athleteOpts } = renderPickOpts(null);
  return `
    <div class="landing">
      <img class="landingLogo" src="${LOGO_IMG}" alt="Austria Climbing Vorarlberg">
      <div class="landingTitle">Trainingspläne</div>
      <div class="landingSub">Wähle einen Gruppen- oder Einzelplan</div>
      <div class="landingBody">
        <div>
          <div class="pickerGroupLabel">Gruppenpläne</div>
          ${groupOpts}
        </div>
        <div>
          <div class="pickerGroupLabel">Einzelpläne SPOGY</div>
          ${athleteOpts}
        </div>
      </div>
    </div>
  `;
}

function wireEvents(){
  document.querySelectorAll('[data-act]').forEach(elm=>{
    elm.addEventListener('click', ()=>{
      const act = elm.getAttribute('data-act');
      if(act==='openPicker') setState({picker:true});
      else if(act==='closePicker') setState({picker:false});
      else if(act==='goHome') setState({view:null, picker:false});
      else if(act==='tab') setState({tab: elm.getAttribute('data-tab')});
      else if(act==='day') setState({day: parseInt(elm.getAttribute('data-i'),10), weekView:'tage'});
      else if(act==='weekview') setState({weekView: elm.getAttribute('data-wv')});
      else if(act==='statseason') setState({statSeason: elm.getAttribute('data-season')});
      else if(act==='prevWeek'){ const nw = addWeeks(state.year, state.kw, -1); setState({year:nw.year, kw:nw.kw, day:0}); }
      else if(act==='nextWeek'){ const nw = addWeeks(state.year, state.kw, 1); setState({year:nw.year, kw:nw.kw, day:0}); }
      else if(act==='pickView'){ setState({view:{t:elm.getAttribute('data-t'), id:elm.getAttribute('data-id')}, picker:false, tab:'Woche', day:0, year:NOW.year, kw:NOW.kw}); }
      else if(act==='pickGroup'){ setState({view:{t:'g', id:elm.getAttribute('data-id')}, tab:'Woche', day:0, year:NOW.year, kw:NOW.kw}); }
    });
  });
}

render();
</script>
</body>
</html>
